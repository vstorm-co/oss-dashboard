name: Collect metrics and deploy Pages
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: oss-dashboard-pages
  cancel-in-progress: false
jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public statistics
        env:
          GH_TOKEN: ${{ secrets.METRICS_GITHUB_TOKEN || github.token }}
        run: python scripts/collect.py
      - name: Persist daily history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update daily OSS metrics [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
